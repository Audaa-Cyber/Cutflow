services:
  cutflow:
    build: .
    container_name: cutflow
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CUTFLOW_DATA_DIR: /app/data
      CUTFLOW_DB_PATH: /app/data/cutflow.sqlite3
      CUTFLOW_ALLOWED_ORIGINS: ${CUTFLOW_ALLOWED_ORIGINS:-https://cutflow-fawn.vercel.app}
      CUTFLOW_MAX_OWNER_ACTIVE_JOBS: ${CUTFLOW_MAX_OWNER_ACTIVE_JOBS:-2}
      CUTFLOW_MAX_OWNER_JOBS: ${CUTFLOW_MAX_OWNER_JOBS:-100}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      YOUTUBE_COOKIES: ${YOUTUBE_COOKIES:-}
      YOUTUBE_COOKIES_FILE: ${YOUTUBE_COOKIES_FILE:-}
      YOUTUBE_PLAYER_CLIENTS: ${YOUTUBE_PLAYER_CLIENTS:-}
      YOUTUBE_PO_TOKEN: ${YOUTUBE_PO_TOKEN:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-2}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-10800}
      MAX_ACTIVE_JOBS: ${MAX_ACTIVE_JOBS:-4}
      WORKER_CONCURRENCY: 1
      FFMPEG_PRESET: veryfast
    volumes:
      - cutflow-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 45s

volumes:
  cutflow-data:
