name: Cutflow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-test.txt
      - name: Install renderer dependencies
        run: npm ci
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check Python syntax
        run: python -m compileall -q backend tests
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Run frontend and deployment tests
        run: npm test
      - name: Build static frontend
        run: npm run build
        env:
          CUTFLOW_API_URL: https://api.example.invalid
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build production image
        run: docker build -t cutflow-ci .
